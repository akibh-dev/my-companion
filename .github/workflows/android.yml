name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Format check, unit + Robolectric tests, lint, build APK
        id: gradle
        shell: bash
        run: |
          set -o pipefail
          ./gradlew ktlintCheck testDebugUnitTest lintDebug assembleDebug \
            --continue --stacktrace 2>&1 | tee build.log

      - name: Publish CI report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GRADLE_OUTCOME: ${{ steps.gradle.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/ci_report.py

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: my-companion-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            build.log
          if-no-files-found: ignore
