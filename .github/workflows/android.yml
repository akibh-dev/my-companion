name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Robolectric's Android jars (~150 MB) live in ~/.m2, which setup-gradle doesn't cache.
      # Without this every run re-downloads them, and Maven Central answers HTTP 429.
      - name: Cache Robolectric Android jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml', 'app/src/test/resources/robolectric.properties') }}

      - name: Fetch pinned offline transliteration models
        run: python3 tools/banglish/fetch_models.py

      # Quran text, page data and fonts (~210 MB of sources); pinned by tools/quran/sources.lock.json.
      - name: Cache Quran sources
        uses: actions/cache@v4
        with:
          path: tools/quran/sources
          key: quran-sources-${{ hashFiles('tools/quran/sources.lock.json') }}

      - name: Fetch and build the Quran assets
        run: |
          pip install -r tools/quran/requirements.txt
          python3 tools/quran/fetch_sources.py
          python3 tools/quran/build_quran_db.py
          python3 -m pytest -q tools/quran

      - name: Format check, unit + Robolectric tests, lint, build APK
        id: gradle
        shell: bash
        env:
          ROBOLECTRIC_REPO_URL: https://maven-central.storage-download.googleapis.com/maven2
        run: |
          set -o pipefail
          ./gradlew ktlintCheck testDebugUnitTest lintDebug assembleDebug lintRelease assembleRelease \
            --continue --stacktrace 2>&1 | tee build.log

      - name: Publish CI report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GRADLE_OUTCOME: ${{ steps.gradle.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/ci_report.py

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: my-companion-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            build.log
          if-no-files-found: ignore
